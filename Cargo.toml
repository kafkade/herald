[workspace]
resolver = "2"
members = ["crates/herald-common", "crates/herald-server", "crates/herald-cli", "crates/herald-web"]
default-members = ["crates/herald-common", "crates/herald-server", "crates/herald-cli"]

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/kafkade/herald"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["json", "ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"

# Web (Leptos + Wasm)
leptos = { version = "0.7", features = ["csr"] }
gloo-net = { version = "0.7", features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Event", "EventTarget", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "Storage", "Headers", "RequestInit", "RequestMode", "Request", "Response", "DragEvent", "DataTransfer", "HtmlElement"] }
js-sys = "0.3"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
futures = "0.3"

# Internal crates
herald-common = { path = "crates/herald-common" }

# Optimize WASM release builds for size
[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.herald-web]
opt-level = "z"
