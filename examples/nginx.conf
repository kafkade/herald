# Herald — Nginx Reverse Proxy Configuration
#
# This configuration handles:
#   - HTTP → HTTPS redirect
#   - TLS termination with Let's Encrypt certificates
#   - Reverse proxying to the Herald backend
#   - WebSocket upgrades for /ws
#   - Gzip compression
#   - Forwarded headers for accurate client IP logging
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/herald
#   2. Replace "herald.example.com" with your actual domain
#   3. Adjust the upstream port (3000) if you changed HERALD_PORT
#   4. Obtain TLS certificates:
#        sudo certbot --nginx -d herald.example.com
#   5. Enable and reload:
#        sudo ln -s /etc/nginx/sites-available/herald /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

# ── Connection upgrade map ────────────────────────────────────────────
# Maps the incoming Upgrade header to the Connection header value.
# If the client sends "Upgrade: websocket", $connection_upgrade becomes
# "upgrade"; otherwise it defaults to "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
# All plain-text HTTP requests are permanently redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name herald.example.com;

    # Let's Encrypt ACME challenge directory — required for certificate
    # renewal when using certbot in standalone or webroot mode.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name herald.example.com;

    # ── TLS certificates (Let's Encrypt / certbot) ────────────────────
    ssl_certificate     /etc/letsencrypt/live/herald.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/herald.example.com/privkey.pem;

    # Modern TLS settings — TLS 1.2+ only, strong ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Gzip compression ──────────────────────────────────────────────
    # Compress common response types to reduce bandwidth.
    gzip on;
    gzip_types text/html application/json application/javascript text/css;
    gzip_min_length 256;

    # ── WebSocket endpoint ────────────────────────────────────────────
    # The /ws path requires HTTP Upgrade headers to establish a
    # persistent WebSocket connection. A long read timeout keeps the
    # connection alive for real-time board updates.
    location /ws {
        proxy_pass http://127.0.0.1:3000;

        # WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward client information to Herald
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive for up to 24 hours.
        # Without this, Nginx closes idle connections after 60 s.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── All other traffic (API + static assets) ───────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
